<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ihollee 3D Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      transition: background-color 0.3s ease;
    }

    model-viewer {
      width: 100%;
      height: 80vh;
      max-width: 800px;
    }

    .color-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .color-button {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      outline: none;
      transition: transform 0.2s ease;
    }

    .color-button:hover {
      transform: scale(1.2);
    }

    .white { background-color: #ffffff; border: 1px solid #ccc; }
    .gray  { background-color: #b3b3b3; }
    .yellow { background-color: #f5cc00; }
    .orange { background-color: #f56d12; }
  </style>
</head>
<body>
  <model-viewer
    src="model.glb"
    alt="ihollee hanger"
    camera-controls
    auto-rotate
    autoplay
    shadow-intensity="1"
    shadow-softness="1"
    environment-image="neutral"
    exposure="1"
    scale="1.5 1.5 1.5"
  ></model-viewer>

  <div class="color-buttons">
    <button class="color-button white" onclick="changeBg('#ffffff')"></button>
    <button class="color-button gray" onclick="changeBg('#b3b3b3')"></button>
    <button class="color-button yellow" onclick="changeBg('#f5cc00')"></button>
    <button class="color-button orange" onclick="changeBg('#f56d12')"></button>
  </div>

  <script>
    function changeBg(color) {
      document.body.style.backgroundColor = color;
    }
  </script>
</body>
</html>
