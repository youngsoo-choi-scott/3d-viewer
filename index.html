<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IHOLLEE Viewer</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="script.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <div class="container">
    <model-viewer 
      id="hanger-viewer"
      src="model.glb"
      alt="A 3D hanger model"
      auto-rotate 
      camera-controls 
      shadow-intensity="1" 
      ar
      style="width: 100%; height: 100vh; background: var(--bg-color);">
    </model-viewer>

    <button onclick="changeBackground()" class="btn">Change Background</button>
  </div>
</body>
</html>
