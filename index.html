<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IHOLLEE 3D Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      transition: background-color 0.6s ease-in-out;
      font-family: sans-serif;
    }

    :root {
      --logo-color: #6C6500;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      opacity: 0;
      transform: scale(0.98);
      animation: fadeInZoom 1.2s ease-out forwards;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .color-buttons {
      position: absolute;
      left: 40px;
      bottom: 50%;
      transform: translateY(50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .color-button {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .color-button:hover {
      transform: scale(1.2);
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.15);
    }

    .white { background-color: #ffffff; }
    .gray { background-color: #b3b3b3; }
    .yellow { background-color: #f5cc00; }
    .orange { background-color: #f56d12; }

    .logo-bg {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      padding: 0 120px;
      z-index: 0;
      display: flex;
      justify-content: center;
    }

    .logo-bg svg {
      width: 100%;
      height: auto;
      color: var(--logo-color);
      transition: color 0.6s ease-in-out;
    }
  </style>
</head>
<body>

  <model-viewer
    src="model.glb"
    alt="IHOLLEE 3D Hanger"
    camera-controls
    shadow-intensity="1"
    auto-rotate
    ar
    exposure="1.2"
    style="--poster-color: transparent;"
  ></model-viewer>

  <div class="color-buttons">
    <div class="color-button white" data-color="#ffffff" data-logocolor="#6C6500"></div>
    <div class="color-button gray" data-color="#b3b3b3" data-logocolor="#222222"></div>
    <div class="color-button yellow" data-color="#f5cc00" data-logocolor="#ffffff"></div>
    <div class="color-button orange" data-color="#f56d12" data-logocolor="#f5cc00"></div>
  </div>

  </div>

  <script>
    const colorButtons = document.querySelectorAll('.color-button');
    const logoSvg = document.querySelector('.logo-bg svg');
    const body = document.body;

    // 배경 색상 및 로고 색상 변경 함수
    function changeBackgroundColor(color, logoColor) {
      body.style.backgroundColor = color;
      logoSvg.style.color = logoColor;
    }

    // 배경 색상 변경 (주기적으로)
    const colors = [
      { background: '#ffffff', logo: '#6C6500' },
      { background: '#b3b3b3', logo: '#222222' },
      { background: '#f5cc00', logo: '#ffffff' },
      { background: '#f56d12', logo: '#f5cc00' }
    ];

    let currentColorIndex = 0;

    setInterval(() => {
      changeBackgroundColor(colors[currentColorIndex].background, colors[currentColorIndex].logo);
      currentColorIndex = (currentColorIndex + 1) % colors.length;
    }, 2500); // 2.5초마다 색상 변경
  </script>
</body>
</html>
