<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>3D Object Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background-color 0.8s ease;
        }

        #viewer-container {
            width: 100%;
            height: 100%;
            position: absolute;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        .color-btn-container {
            position: absolute;
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .color-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .color-btn.default { background-color: #ffffff; }
        .color-btn.gray { background-color: #b3b3b3; }
        .color-btn.yellow { background-color: #f5cc00; }
        .color-btn.orange { background-color: #f56d12; }

        .color-btn:hover { opacity: 0.8; }
    </style>

    <!-- model-viewer 라이브러리 -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
    <div id="viewer-container">
        <model-viewer id="viewer"
            src="https://raw.githubusercontent.com/youngsoo-choi-scott/3d-viewer/main/model.glb"
            alt="3D model"
            auto-rotate
            camera-orbit="0deg 75deg 500px"
            style="width: 100%; height: 100%; background-color: transparent;">
        </model-viewer>

        <div class="color-btn-container">
            <div class="color-btn default" onclick="changeBackgroundColor('#ffffff')"></div>
            <div class="color-btn gray" onclick="changeBackgroundColor('#b3b3b3')"></div>
            <div class="color-btn yellow" onclick="changeBackgroundColor('#f5cc00')"></div>
            <div class="color-btn orange" onclick="changeBackgroundColor('#f56d12')"></div>
        </div>
    </div>

    <script>
        function changeBackgroundColor(color) {
            document.body.style.backgroundColor = color;
        }

        const colors = ['#ffffff', '#b3b3b3', '#f5cc00', '#f56d12'];
        let colorIndex = 0;

        setInterval(() => {
            changeBackgroundColor(colors[colorIndex]);
            colorIndex = (colorIndex + 1) % colors.length;
        }, 3000);
    </script>
</body>
</html>
