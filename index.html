<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IHOLLEE 3D Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      transition: background-color 0.6s ease-in-out;
      font-family: sans-serif;
    }

    :root {
      --logo-color: #111111; /* 초기 텍스트 색상 */
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      opacity: 0;
      transform: scale(0.98);
      animation: fadeInZoom 1.2s ease-out forwards;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .color-buttons {
      position: absolute;
      left: 40px;
      bottom: 50%;
      transform: translateY(50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .color-button {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .color-button:hover {
      transform: scale(1.2);
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.15);
    }

    .white { background-color: #ffffff; }
    .gray { background-color: #b3b3b3; }
    .yellow { background-color: #f5cc00; }
    .orange { background-color: #f56d12; }

    .logo-bg {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      padding: 0 40px;
      z-index: -1;
      display: flex;
      justify-content: center;
    }

    .logo-bg svg {
      width: 100%;
      height: auto;
      color: var(--logo-color);
    }
  </style>
</head>
<body>

  <model-viewer
    src="model.glb"
    alt="IHOLLEE 3D Hanger"
    camera-controls
    shadow-intensity="1"
    auto-rotate
    ar
    exposure="1.2"
    style="--poster-color: transparent;"
  ></model-viewer>

  <div class="color-buttons">
    <div class="color-button white" onclick="setManualColor('#ffffff')"></div>
    <div class="color-button gray" onclick="setManualColor('#b3b3b3')"></div>
    <div class="color-button yellow" onclick="setManualColor('#f5cc00')"></div>
    <div class="color-button orange" onclick="setManualColor('#f56d12')"></div>
  </div>

  <script>
    const colors = ['#ffffff', '#b3b3b3', '#f5cc00', '#f56d12'];
    let colorIndex = 0;
    let autoChange = true;
    let resumeTimeout;

    function changeBG(color) {
      document.body.style.backgroundColor = color;
      document.documentElement.style.setProperty('--logo-color', getContrastColor(color));
    }

    function setManualColor(color) {
      changeBG(color);
      const newIndex = colors.indexOf(color);
      if (newIndex !== -1) {
        colorIndex = (newIndex + 1) % colors.length;
      }
      pauseAutoChange();
    }

    function pauseAutoChange() {
      autoChange = false;
      clearTimeout(resumeTimeout);
      resumeTimeout = setTimeout(() => {
        autoChange = true;
      }, 3000);
    }

    setInterval(() => {
      if (autoChange) {
        changeBG(colors[colorIndex]);
        colorIndex = (colorIndex + 1) % colors.length;
      }
    }, 3000);

    document.querySelectorAll('.color-button').forEach((button) => {
      button.addEventListener('click', () => {
        const color = window.getComputedStyle(button).backgroundColor;
        const hexColor = rgbToHex(color);
        setManualColor(hexColor);
      });
    });

    function rgbToHex(rgb) {
      const result = rgb.match(/\d+/g);
      if (!result) return '#ffffff';
      return (
        '#' +
        result
          .map((num) => {
            const hex = parseInt(num).toString(16);
            return hex.length === 1 ? '0' + hex : hex;
          })
          .join('')
      );
    }

    function getContrastColor(hex) {
      const r = parseInt(hex.substr(1, 2), 16);
      const g = parseInt(hex.substr(3, 2), 16);
      const b = parseInt(hex.substr(5, 2), 16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 128 ? '#111111' : '#ffffff';
    }
  </script>
