<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IHOLLEE 3D Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      opacity: 1;
      transform: scale(1);
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1; /* 모델이 로고보다 위에 오도록 설정 */
    }

    .color-buttons {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 2; /* 색상 버튼은 모델과 로고보다 위에 위치 */
    }

    .color-button {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .color-button:hover {
      transform: scale(1.2);
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.15);
    }

    .white { background-color: #ffffff; }
    .gray { background-color: #b3b3b3; }
    .yellow { background-color: #f5cc00; }
    .orange { background-color: #f56d12; }

    #logo-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 80px); /* 좌우 마진 40px씩 적용 */
      height: 100%;
      z-index: 0; /* 3D 모델 뒤에 위치하도록 설정 */
      overflow: hidden; /* 로고 잘리지 않게 처리 */
    }

    #logo-container svg {
      width: 100%;
      height: 100%;
      fill: #6c6400; /* 로고 단색으로 설정 */
      object-fit: contain; /* SVG 내용이 비율을 유지하며 꽉 차도록 조정 */
    }
  </style>
</head>
<body>

  <!-- 3D 모델 뷰어 -->
  <model-viewer
    src="model.glb"
    alt="IHOLLEE 3D Hanger"
    camera-controls
    shadow-intensity="1"
    auto-rotate
    ar
    exposure="1.2">
  </model-viewer>

  <!-- SVG 로고 삽입 -->
  <div id="logo-container">
    <!-- 실제 로고 SVG 내용으로 교체 -->

            fill: #6c6400;
            stroke-width: 0px;
          }
        </style>
      </defs>

    </svg>
  </div>

  <!-- 색상 선택 버튼 -->
  <div class="color-buttons">
    <div class="color-button white" onclick="setManualColor('#ffffff')"></div>
    <div class="color-button gray" onclick="setManualColor('#b3b3b3')"></div>
    <div class="color-button yellow" onclick="setManualColor('#f5cc00')"></div>
    <div class="color-button orange" onclick="setManualColor('#f56d12')"></div>
  </div>

  <script>
    function setManualColor(color) {
      document.querySelector('model-viewer').style.backgroundColor = color;
    }
  </script>
</body>
</html>
