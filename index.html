<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Object Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #viewer-container {
            width: 100%;
            height: 100%;
            position: absolute; /* Ensure the viewer takes full screen */
        }

        /* 3D object style */
        #viewer {
            width: 100%;
            height: 100%;
        }

        /* Color change buttons */
        .color-btn-container {
            position: absolute;
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10; /* Make sure buttons are above the 3D model */
        }

        .color-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.1);
            opacity: 1;
            cursor: pointer;
        }

        .color-btn.default {
            background-color: #ffffff;
        }

        .color-btn.gray {
            background-color: #b3b3b3;
        }

        .color-btn.yellow {
            background-color: #f5cc00;
        }

        .color-btn.orange {
            background-color: #f56d12;
        }

        /* Button hover effect */
        .color-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="viewer-container">
        <div id="viewer"></div>

        <!-- Color change buttons -->
        <div class="color-btn-container">
            <div class="color-btn default" onclick="changeBackgroundColor('#ffffff')"></div>
            <div class="color-btn gray" onclick="changeBackgroundColor('#b3b3b3')"></div>
            <div class="color-btn yellow" onclick="changeBackgroundColor('#f5cc00')"></div>
            <div class="color-btn orange" onclick="changeBackgroundColor('#f56d12')"></div>
        </div>
    </div>

    <!-- 3D Model Viewer Script -->
    <script src="https://cdn.jsdelivr.net/npm/@google/model-viewer"></script>
    <script>
        // 3D Model Viewer Setup
        const viewer = document.createElement('model-viewer');
        viewer.src = 'https://raw.githubusercontent.com/youngsoo-choi-scott/3d-viewer/main/model.glb';
        viewer.alt = 'A 3D model of a hanger';
        viewer.auto-rotate = true;
        viewer.camera-orbit = '0deg 75deg 500px';
        viewer.style.width = '100%';
        viewer.style.height = '100%';
        viewer.setAttribute('background-color', 'transparent');
        document.getElementById('viewer').appendChild(viewer);

        // Function to change background color
        function changeBackgroundColor(color) {
            document.body.style.backgroundColor = color;
        }
    </script>
</body>
</html>
