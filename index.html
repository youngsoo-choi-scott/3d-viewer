<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ihollee 3D Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #ffffff;
      transition: background-color 0.5s ease;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    model-viewer {
      width: 100%;
      height: 80vh;
    }
    .buttons {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      border: none;
      background-color: #444;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }
    button:hover {
      background-color: #000;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="model.glb"
    alt="ihollee hanger"
    auto-rotate
    camera-controls
    ar
    shadow-intensity="1"
    background-color="#ffffff">
  </model-viewer>

  <div class="buttons">
    <button onclick="changeBG('#ffffff')">White</button>
    <button onclick="changeBG('#f4f4f4')">Light Gray</button>
    <button onclick="changeBG('#000000')">Black</button>
    <button onclick="changeBG('#dfe6e9')">Soft Blue</button>
  </div>

  <script>
    function changeBG(color) {
      document.body.style.backgroundColor = color;
      const viewer = document.querySelector('model-viewer');
      viewer.setAttribute('background-color', color);
    }
  </script>
</body>
</html>
