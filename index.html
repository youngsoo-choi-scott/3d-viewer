<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IHOLLEE 3D Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      transition: background-color 0.6s ease-in-out;
      font-family: sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      opacity: 0;
      transform: scale(0.98);
      animation: fadeInZoom 1.2s ease-out forwards;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .color-buttons {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .color-button {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .color-button:hover {
      transform: scale(1.2);
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.15);
    }

    .white { background-color: #ffffff; }
    .gray { background-color: #b3b3b3; }
    .yellow { background-color: #f5cc00; }
    .orange { background-color: #f56d12; }
  </style>
</head>
<body>

  <model-viewer
    src="model.glb"
    alt="IHOLLEE 3D Hanger"
    camera-controls
    shadow-intensity="1"
    auto-rotate
    ar
    exposure="1.2"
    style="--poster-color: transparent;"
  ></model-viewer>

  <div class="color-buttons">
    <div class="color-button white" onclick="setManualColor('#ffffff')"></div>
    <div class="color-button gray" onclick="setManualColor('#b3b3b3')"></div>
    <div class="color-button yellow" onclick="setManualColor('#f5cc00')"></div>
    <div class="color-button orange" onclick="setManualColor('#f56d12')"></div>
  </div>

  <script>
  const colors = ['#ffffff', '#b3b3b3', '#f5cc00', '#f56d12'];
  let colorIndex = 0;
  let autoChange = true;
  let resumeTimeout;

  function changeBG(color) {
    document.body.style.backgroundColor = color;
  }

  function setManualColor(color) {
    changeBG(color);
    // 클릭한 색상에 해당하는 인덱스를 colorIndex로 설정
    const newIndex = colors.indexOf(color);
    if (newIndex !== -1) {
      colorIndex = (newIndex + 1) % colors.length; // 다음 순서부터 이어지게
    }
    pauseAutoChange();
  }

  function pauseAutoChange() {
    autoChange = false;
    clearTimeout(resumeTimeout);
    resumeTimeout = setTimeout(() => {
      autoChange = true;
    }, 10000); // 10초 후 자동 변경 다시 시작
  }

  setInterval(() => {
    if (autoChange) {
      changeBG(colors[colorIndex]);
      colorIndex = (colorIndex + 1) % colors.length;
    }
  }, 3000);

  // 버튼 클릭 시 색상 변경 및 자동 재개 예약
  document.querySelectorAll('.color-button').forEach((button) => {
    button.addEventListener('click', () => {
      const color = window.getComputedStyle(button).backgroundColor;
      // RGB → HEX 변환
      const hexColor = rgbToHex(color);
      setManualColor(hexColor);
    });
  });

  // RGB 문자열을 HEX 코드로 변환
  function rgbToHex(rgb) {
    const result = rgb.match(/\d+/g);
    if (!result) return '#ffffff';
    return (
      '#' +
      result
        .map((num) => {
          const hex = parseInt(num).toString(16);
          return hex.length === 1 ? '0' + hex : hex;
        })
        .join('')
    );
  }
</script>


</body>
</html>
