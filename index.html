<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D with SVG Logo</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff; /* 초기 배경색 */
      transition: background-color 0.5s;
    }

    canvas {
      position: relative;
      z-index: 1;
    }

    #logo {
      position: absolute;
      z-index: 0; /* 3D 오브젝트(캔버스) 뒤에 배치 */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      fill: #000000; /* 초기 SVG 색상 */
      transition: fill 0.5s;
    }

    .color-toggle-btn {
      position: absolute;
      z-index: 2;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- SVG 로고 (3D 오브젝트 뒤에 위치) -->
    <svg id="logo" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" />
    </svg>

    <!-- 3D 캔버스 자리 -->
    <canvas id="three-canvas"></canvas>

    <!-- 색상 변경 버튼 -->
    <button class="color-toggle-btn" onclick="changeColor()">색상 변경</button>
  </div>

  <script>
    // 초기 색상
    let isDark = false;

    function changeColor() {
      const container = document.getElementById("container");
      const logo = document.getElementById("logo");

      if (isDark) {
        container.style.backgroundColor = "#ffffff"; // 밝은 배경
        logo.style.fill = "#000000"; // 어두운 로고
      } else {
        container.style.backgroundColor = "#111111"; // 어두운 배경
        logo.style.fill = "#ffffff"; // 밝은 로고
      }

      isDark = !isDark;
    }
  </script>
</body>
</html>
