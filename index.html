<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body {
        margin: 0;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      model-viewer {
        width: 100%;
        height: 80vh;
        background-color: transparent;
      }

      .color-buttons {
        margin-top: 20px;
        display: flex;
        gap: 12px;
      }

      .color-btn {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid #ccc;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .color-btn:hover {
        transform: scale(1.2);
      }
    </style>
  </head>
  <body>
    <model-viewer
      src="model.glb"
      alt="3D model"
      auto-rotate
      camera-controls
      ar
    ></model-viewer>

    <div class="color-buttons">
      <div class="color-btn" style="background-color: #ffffff" onclick="changeBgColor('#ffffff')"></div>
      <div class="color-btn" style="background-color: #b3b3b3" onclick="changeBgColor('#b3b3b3')"></div>
      <div class="color-btn" style="background-color: #f5cc00" onclick="changeBgColor('#f5cc00')"></div>
      <div class="color-btn" style="background-color: #f56d12" onclick="changeBgColor('#f56d12')"></div>
    </div>

    <script>
      function changeBgColor(color) {
        document.body.style.backgroundColor = color;
      }
    </script>
  </body>
</html>
