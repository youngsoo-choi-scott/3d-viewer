<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IHOLLEE 3D Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', sans-serif;
      letter-spacing: -0.025em;
      color: #333332;
      background: radial-gradient(circle at center, #B4AF77, #D9D4B2, #EBE7D0, #FDF9EE);
      background-size: 200% 200%;
      animation: gradientWaves 10s ease infinite;
      position: relative;
    }

    /* 텍스트 배경 */
    .background-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 0;
      display: flex;
      opacity: 0;
      animation: fadeInZoom 0.8s ease-out forwards;
    }

    .left-text,
    .right-text {
      display: flex;
      align-items: baseline;
      box-sizing: border-box;
      color: #cccccc;
    }

    .left-text {
      width: 66.66%;
      padding: 72px 0 0 40px;
      font-size: 52px;
      justify-content: flex-start;
      text-align: left;
    }

    .right-text {
      width: 33.33%;
      padding: 72px 40px 0 0;
      font-size: 20px;
      justify-content: flex-start;
      text-align: left;
      position: relative;
      line-height: 170%;
      word-break: keep-all;
    }

    .divider {
      position: absolute;
      left: 0;
      top: 5%;
      height: 90%;
      border-right: 0px solid #cccccc;
    }

    /* model-viewer 스타일 */
    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      opacity: 0;
      animation: fadeInZoom 1.2s ease-out forwards;
    }

     @keyframes gradientWaves {
        0% { background-position: 50% 50%; }
        50% { background-position: 100% 100%; }
        100% { background-position: 50% 50%; }
      }
    
    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 로고 */
    .logo {
      width: 240px;
      margin-bottom: 24px;
      color: #ffffff;
    }
    
  </style>
</head>
<body>

      </div>
    </div>
    <div class="right-text">
      <div class="divider"></div>
      디자이너의 철학과 감각을 더했습니다. 
      단순한 도구가 아닌, 감각적인 오브제. 
      형태는 우아하게, 기능은 탁월하게, 
      아이홀리는 실용성과 조형미를 균형 있게 담아냈습니다. 
      일상을 더 아름답게, 아이홀리.
    </div>
  </div>

  <!-- 3D 뷰어 -->
  <model-viewer
    src="model.glb"
    alt="IHOLLEE 3D Hanger"
    camera-controls
    camera-orbit="305deg 110deg 1m"
    field-of-view="25deg"
    shadow-intensity="0"
    environment-image="neutral"
    exposure="2"
    style="--poster-color: transparent;"
  ></model-viewer>

</body>
</html>
