<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IHOLLEE 3D Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #ffffff;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      transform: scale(1.5);
      transform-origin: center center;
      background-color: transparent;
      opacity: 0;
      animation: fadeInZoom 1.2s ease-out forwards;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <model-viewer
    src="model_silver.glb"
    alt="IHOLLEE 3D Hanger"
    camera-controls
    camera-orbit="305deg 110deg 1m"
    shadow-intensity="0"
    ar
    environment-image="neutral"
    exposure="2"
    style="--poster-color: transparent;"
    field-of-view="25deg"
  ></model-viewer>

  <script>
  const body = document.body;
  </script>

</body>
</html>
