<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IHOLLEE 3D Viewer</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', 'Pretendard', sans-serif;
      letter-spacing: -0.03em;
      color: #333332;
      background: #f4f4f4;
      position: relative;
    }

    /* 텍스트 배경 */
    .background-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 0;
      display: flex;
      opacity: 0;
      animation: fadeInZoom 0.8s ease-out forwards;
    }

    .left-text,
    .right-text {
      padding: 18px 40px;
      display: flex;
      align-items: baseline;
      box-sizing: border-box;
      color: #cccccc;
      letter-spacing: -0.06em;
      line-height: 110%;
    }

    .left-text {
      width: 65%;
      font-size: 40px;
      justify-content: flex-start;
      text-align: left;
    }

    .right-text {
      width: 35%;
      font-size: 40px;
      justify-content: flex-start;
      text-align: left;
      position: relative;
      list-style: none;
    }

    .right-text ul{
      list-style: none;
    }

    .divider {
      position: absolute;
      left: 0;
      top: 5%;
      height: 90%;
      border-right: 0px solid #cccccc;
    }

    /* model-viewer 스타일 */
    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      opacity: 0;
      animation: fadeInZoom 1.2s ease-out forwards;
    }

    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- 텍스트 배경 -->
  <div class="background-text">
    <div class="left-text">
      Daily. Comfort. Fresh <br>Ihollee Hanger
    </div>
    <div class="right-text">
      <div class="divider"></div>
      <ul>
        <li>Air Circulation</li>
        <li>Non-slip Grip</li>
        <li>Stackable Design</li>
        <li>Shoulder Care</li>
        <li>Soft Curves</li>
        <li>Link Hook</li>
      </ul>
    </div>
  </div>

  <!-- 3D 뷰어 -->
  <model-viewer
    src="model_silver.glb"
    alt="IHOLLEE 3D Hanger"
    camera-controls
    camera-orbit="305deg 110deg 1m"
    field-of-view="25deg"
    shadow-intensity="0"
    environment-image="neutral"
    exposure="2"
    style="--poster-color: transparent;"
  ></model-viewer>

</body>
</html>
