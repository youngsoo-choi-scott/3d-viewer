<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IHOLLEE 3D Viewer</title>
  
  <!-- 폰트 링크 -->
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet">
  
  <!-- model-viewer 라이브러리 -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', 'Pretendard', sans-serif;
      letter-spacing: -0.03em;
      color: #333332;
      background: #6C6500;
      position: relative;
    }

    /* 중앙 텍스트 배경 */
    .background-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 0;
      display: flex;
      opacity: 0;
      animation: fadeInZoom 0.8s ease-out forwards;
    }

    .center-text {
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 100px;
      font-weight: 600;
      line-height: 110%;
      color: #482D80;
      flex-direction: column;
    }

    /* 하단 텍스트 */
    .bottom-text {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 16px 0;
      font-size: 16px;
      font-weight: 400;
      background-color: transparent;
      color: #482D80;
      z-index: 2;
      opacity: 0;
      animation: fadeInZoom 1.2s ease-out forwards;
    }

    /* 3D 모델 스타일 */
    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      opacity: 0;
      animation: fadeInZoom 1.2s ease-out forwards;
    }

    /* 애니메이션 */
    @keyframes fadeInZoom {
      0% {
        opacity: 0;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <!-- 중앙 텍스트 -->
  <div class="background-text">
    <div class="center-text">
      <p>AIR CIRCULATION</p>
      <p>NON-SLIP GRIP</p>
      <p>STACKABLE DESIGN</p>
      <p>SOFT CURVES</p>
    </div>
  </div>

  <!-- 하단 텍스트 -->
  <div class="bottom-text">
    IHOLLEE, SENSE ABOVE THE FAMILIAR
  </div>

  <!-- 3D 모델 -->
  <model-viewer
    src="model_silver_color.glb"
    alt="IHOLLEE 3D Hanger"
    camera-controls
    camera-orbit="305deg 110deg 1m"
    field-of-view="25deg"
    shadow-intensity="0"
    environment-image="neutral"
    exposure="2"
    style="--poster-color: transparent;"
  ></model-viewer>

</body>
</html>
